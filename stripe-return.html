<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Returning to SoloWorks…</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #F7F7F5;
    color: #1A1A1A;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    padding: 24px;
    text-align: center;
  }
  .spinner {
    width: 32px; height: 32px;
    border: 3px solid #E5E7EB;
    border-top-color: #1DB87A;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-bottom: 20px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 { font-size: 17px; font-weight: 700; margin: 0 0 8px; }
  p { font-size: 14px; color: #6B7280; margin: 0 0 24px; }
  a.button {
    display: inline-block;
    background: #1DB87A;
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    text-decoration: none;
    padding: 12px 28px;
    border-radius: 13px;
  }
</style>
</head>
<body>
  <div class="spinner"></div>
  <h1>Returning to SoloWorks</h1>
  <p>If nothing happens automatically, tap the button below.</p>
  <a class="button" href="soloworks://stripe-return" id="manual-link">Open SoloWorks</a>

  <script>
    // Attempt an immediate redirect back into the app.
    window.location.href = "soloworks://stripe-return";
  </script>
</body>
</html>
